<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - SUPER PRO SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="text-center mb-4">
                <h2>SUPER PRO SYSTEM</h2>
                <p class="text-muted">نظام إدارة الشركة المتكامل</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>
            
            <div class="mt-3 text-center">
                <small class="text-muted">
                    المستخدمون الافتراضيون:<br>
                    admin/admin123 | manager/manager123 | employee/employee123
                </small>
            </div>
        </div>
    </div>

    <script>
        // تهيئة المستخدمين الافتراضيين
        const defaultUsers = [
            {
                id: 1,
                email: 'admin',
                password: 'admin123',
                name: 'مدير النظام',
                role: 'admin',
                status: 'active'
            },
            {
                id: 2,
                email: 'manager',
                password: 'manager123',
                name: 'مدير',
                role: 'manager',
                status: 'active'
            },
            {
                id: 3,
                email: 'employee',
                password: 'employee123',
                name: 'موظف',
                role: 'employee',
                status: 'active'
            }
        ];

        // حفظ المستخدمين في localStorage
        localStorage.setItem('users', JSON.stringify(defaultUsers));

        // تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // البحث عن المستخدم
            const user = defaultUsers.find(u => u.email === username && u.password === password);
            
            if (user) {
                alert('✅ تسجيل الدخول بنجاح!\n\nالمستخدم: ' + user.name + '\nالدور: ' + user.role);
                
                // حفظ الجلسة
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                // الانتقال إلى الصفحة الرئيسية
                window.location.href = 'index.html';
            } else {
                alert('❌ اسم المستخدم أو كلمة المرور غير صحيحة');
            }
        });
    </script>
</body>
</html>
