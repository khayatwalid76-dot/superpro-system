<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص التسجيل السحابي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4"><i class="fas fa-cloud me-2"></i>فحص نظام التسجيل السحابي</h1>
        
        <div class="test-section">
            <h3><i class="fas fa-database me-2"></i>1. فحص اتصال Firebase</h3>
            <div id="firebase-status" class="status">جاري الفحص...</div>
        </div>
        
        <div class="test-section">
            <h3><i class="fas fa-upload me-2"></i>2. فحص حفظ البيانات</h3>
            <div id="save-status" class="status">جاري الفحص...</div>
            <button class="btn btn-primary mt-2" onclick="testSaveData()">اختبار حفظ البيانات</button>
        </div>
        
        <div class="test-section">
            <h3><i class="fas fa-download me-2"></i>3. فحص تحميل البيانات</h3>
            <div id="load-status" class="status">جاري الفحص...</div>
            <button class="btn btn-primary mt-2" onclick="testLoadData()">اختبار تحميل البيانات</button>
        </div>
        
        <div class="test-section">
            <h3><i class="fas fa-bell me-2"></i>4. فحص نظام الإشعارات</h3>
            <div id="notification-status" class="status">جاري الفحص...</div>
            <button class="btn btn-primary mt-2" onclick="testNotifications()">اختبار الإشعارات</button>
        </div>
        
        <div class="test-section">
            <h3><i class="fas fa-list me-2"></i>5. فحص المسافات في القوائم</h3>
            <div id="spacing-status" class="status">جاري الفحص...</div>
            <button class="btn btn-primary mt-2" onclick="checkSpacing()">فحص المسافات</button>
        </div>
        
        <div class="test-section">
            <h3><i class="fas fa-info-circle me-2"></i>6. معلومات النظام</h3>
            <div id="system-info"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyClOXATkxQ8XLrorz80JhkUdxXjbcySr2E",
            authDomain: "superpro-system-8871f.firebaseapp.com",
            projectId: "superpro-system-8871f",
            storageBucket: "superpro-system-8871f.firebasestorage.app",
            messagingSenderId: "318335312258",
            appId: "1:318335312258:web:42879aaee5fc8b9a126f9b",
            measurementId: "G-X4RJQYCS7N",
            databaseURL: "https://superpro-system-8871f-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        // تهيئة Firebase
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            updateStatus('firebase-status', 'success', '✅ تم تهيئة Firebase بنجاح');
        } catch (error) {
            updateStatus('firebase-status', 'error', '❌ فشل تهيئة Firebase: ' + error.message);
        }

        // دالة تحديث الحالة
        function updateStatus(elementId, type, message) {
            const element = document.getElementById(elementId);
            element.className = `status ${type}`;
            element.innerHTML = message;
        }

        // اختبار حفظ البيانات
        async function testSaveData() {
            if (!db) {
                updateStatus('save-status', 'error', '❌ Firebase غير مهيأ');
                return;
            }

            try {
                const testData = {
                    test: true,
                    timestamp: new Date().toISOString(),
                    message: 'اختبار حفظ البيانات'
                };
                
                await db.ref('test').set(testData);
                updateStatus('save-status', 'success', '✅ تم حفظ البيانات بنجاح');
            } catch (error) {
                updateStatus('save-status', 'error', '❌ فشل حفظ البيانات: ' + error.message);
            }
        }

        // اختبار تحميل البيانات
        async function testLoadData() {
            if (!db) {
                updateStatus('load-status', 'error', '❌ Firebase غير مهيأ');
                return;
            }

            try {
                const snapshot = await db.ref('data').once('value');
                const data = snapshot.val();
                
                if (data) {
                    const count = Object.keys(data).length;
                    updateStatus('load-status', 'success', `✅ تم تحميل البيانات بنجاح (${count} مجموعات بيانات)`);
                } else {
                    updateStatus('load-status', 'warning', '⚠️ لا توجد بيانات في السحابة');
                }
            } catch (error) {
                updateStatus('load-status', 'error', '❌ فشل تحميل البيانات: ' + error.message);
            }
        }

        // اختبار الإشعارات
        function testNotifications() {
            try {
                // اختبار Notification API
                if ('Notification' in window) {
                    if (Notification.permission === 'granted') {
                        updateStatus('notification-status', 'success', '✅ إذن الإشعارات ممنوح');
                        showTestNotification();
                    } else if (Notification.permission === 'denied') {
                        updateStatus('notification-status', 'error', '❌ إذن الإشعارات مرفوض');
                    } else {
                        Notification.requestPermission().then(permission => {
                            if (permission === 'granted') {
                                updateStatus('notification-status', 'success', '✅ تم منح إذن الإشعارات');
                                showTestNotification();
                            } else {
                                updateStatus('notification-status', 'warning', '⚠️ إذن الإشعارات غير ممنوح');
                            }
                        });
                    }
                } else {
                    updateStatus('notification-status', 'error', '❌ المتصفح لا يدعم الإشعارات');
                }
            } catch (error) {
                updateStatus('notification-status', 'error', '❌ خطأ في نظام الإشعارات: ' + error.message);
            }
        }

        // عرض إشعار اختباري
        function showTestNotification() {
            new Notification('اختبار الإشعارات', {
                body: 'هذا إشعار اختباري من نظام SUPER_PRO',
                icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔔</text></svg>'
            });
        }

        // فحص المسافات في القوائم
        function checkSpacing() {
            const issues = [];
            
            // فحص مسافات الحقول
            const formControls = document.querySelectorAll('input, select, textarea');
            formControls.forEach(element => {
                const style = window.getComputedStyle(element);
                const marginTop = parseInt(style.marginTop);
                const marginBottom = parseInt(style.marginBottom);
                
                if (marginTop > 20 || marginBottom > 20) {
                    issues.push(`مسافة كبيرة فوق/تحت حقل: ${element.name || element.id || 'غير معروف'}`);
                }
            });
            
            if (issues.length === 0) {
                updateStatus('spacing-status', 'success', '✅ لا توجد مشاكل في المسافات');
            } else {
                updateStatus('spacing-status', 'warning', '⚠️ تم العثور على مشاكل في المسافات:<br>' + issues.join('<br>'));
            }
        }

        // عرض معلومات النظام
        function showSystemInfo() {
            const info = `
                <strong>معلومات المتصفح:</strong><br>
                - المتصفح: ${navigator.userAgent}<br>
                - اللغة: ${navigator.language}<br>
                - اتجاه النص: ${document.dir}<br><br>
                
                <strong>معلومات Firebase:</strong><br>
                - معرف المشروع: ${firebaseConfig.projectId}<br>
                - رابط قاعدة البيانات: ${firebaseConfig.databaseURL}<br><br>
                
                <strong>حالة التخزين:</strong><br>
                - Local Storage: ${localStorage.length} عناصر<br>
                - Session Storage: ${sessionStorage.length} عناصر<br>
            `;
            
            document.getElementById('system-info').innerHTML = info;
        }

        // التحقق التلقائي عند التحميل
        window.onload = function() {
            showSystemInfo();
            testLoadData();
            testNotifications();
        };
    </script>
</body>
</html>
